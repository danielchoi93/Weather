<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B2433;
    --panel: #232E40;
    --ink: #EEF1F5;
    --muted: #93A0B4;
    --rule: #34415A;
    --num: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
    --text: "Instrument Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--text);
    padding: max(2.5vh, env(safe-area-inset-top)) 3.5vw max(2.5vh, env(safe-area-inset-bottom));
    display: grid; grid-template-rows: auto 1fr; gap: 2.4vh;
    overflow: hidden;
  }

  .top { display: grid; grid-template-columns: 1fr auto 1fr; gap: 3vw; align-items: center; min-height: 25vh; }
  .top > :first-child { justify-self: start; }
  .side { justify-self: end; align-self: center; width: min(100%, 30ch); }
  .now-temp { font-family: var(--num); font-weight: 800; line-height: .8; font-size: min(21vh, 15vw); letter-spacing: -.01em; }
  .now-temp sup { font-size: .38em; vertical-align: top; position: relative; top: .1em; font-weight: 500; color: var(--muted); }
  .now-row { display: flex; align-items: flex-start; gap: 1vw; }
  .now-icon { width: min(10.5vh, 7.5vw); height: min(10.5vh, 7.5vw); flex: none; margin-top: 1vh; }
  .now-meta { font-size: min(3.2vh, 2.6vw); color: var(--muted); margin-top: 1.4vh; }
  .now-meta b { color: var(--ink); font-weight: 600; }

  .line { font-size: min(2.5vh, 1.9vw); line-height: 1.35; font-weight: 500; text-wrap: pretty; }
  .line-kind { font-size: min(2.1vh, 1.6vw); font-weight: 600; color: var(--muted); margin-bottom: .8vh; }
  .line-src { display: block; font-size: .85em; color: var(--muted); font-weight: 400; margin-top: .6vh; }

  .clock { text-align: center; align-self: center; }
  .clock .time { white-space: nowrap; font-family: var(--num); font-weight: 800; font-size: min(21vh, 15vw); line-height: .8; letter-spacing: -.01em; }
  .clock .time sup { font-size: .38em; vertical-align: top; position: relative; top: .1em; font-weight: 500; color: var(--muted); margin-left: .06em; }
  .clock .date { font-size: min(3.2vh, 2.6vw); color: var(--muted); margin-top: 1.4vh; }
  .clock .date b { color: var(--ink); font-weight: 600; }

  .days { display: grid; grid-template-rows: 1fr 1fr; gap: 1.6vw; min-height: 0; }
  .day { background: var(--panel); border-radius: 18px; padding: 2vh 2.6vw; display: grid; grid-template-columns: 12.5em 1fr auto 1fr; align-items: center; gap: 1.6vw; font-size: min(2.6vh, 2vw); min-height: 0; }
  .day-name { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto; column-gap: .8em; align-items: center; }
  .day-name b { font-size: 1.7em; font-weight: 700; grid-column: 1; }
  .day-name span { color: var(--muted); grid-column: 1; }
  .day-icon { grid-column: 2; grid-row: 1 / 3; width: 3.6em; height: 3.6em; justify-self: start; }
  .day-name em { grid-column: 1 / -1; font-style: normal; color: #8FB8E8; font-weight: 600; margin-top: .5em; }
  .day-temp { display: flex; flex-direction: column; align-items: center; line-height: .85; }
  .day-temp span { color: var(--muted); font-size: 1em; margin-bottom: .5vh; }
  .day-temp b { font-family: var(--num); font-weight: 800; font-size: min(17vh, 12vw); }
  .day-arrow { width: min(10vh, 7vw); height: auto; }
  .status { font-size: .75em; color: var(--muted); text-align: right; margin-top: .6vh; }
  .status.warn { color: #F0C75E; }
  .lower { display: grid; grid-template-columns: 1fr minmax(0, 30%); gap: 1.6vw; min-height: 0; }
  .week { background: var(--panel); border-radius: 18px; padding: 1.6vh 1.6vw; display: flex; flex-direction: column; min-height: 0; }
  .wk-rows { flex: 1; display: flex; flex-direction: column; justify-content: space-around; margin-top: .8vh; }
  .wk-row { display: grid; grid-template-columns: 3.4em 2.4em 2.1em 1fr 2.1em; align-items: center; gap: .5vw; font-size: min(2.6vh, 2vw); }
  .wk-row + .wk-row { border-top: 1px solid var(--rule); padding-top: .4vh; }
  .wk-day { font-weight: 600; }
  .wk-icon { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .wk-icon svg { width: 2.1em; height: 2.1em; }
  .wk-icon em { font-style: normal; font-size: .62em; color: #8FB8E8; font-weight: 600; margin-top: -.2em; }
  .wk-lo, .wk-hi { font-family: var(--num); font-weight: 700; font-size: 1.25em; text-align: right; }
  .wk-lo { color: var(--muted); }
  .wk-bar { position: relative; height: .36em; border-radius: 1em; background: #34415A; }
  .wk-fill { position: absolute; top: 0; bottom: 0; border-radius: 1em; }
  .dot { position: absolute; top: 50%; width: .62em; height: .62em; margin: -.31em 0 0 -.31em; border-radius: 50%; background: #EEF1F5; border: 2px solid var(--panel); }
  .chart-title { font-size: min(2.6vh, 2vw); color: var(--muted); font-weight: 500; }
  .chart-title b { color: var(--ink); font-weight: 600; }


  .msg { grid-row: 1 / -1; align-self: center; justify-self: center; font-size: 3vh; color: var(--muted); text-align: center; max-width: 40ch; line-height: 1.4; }

  @media (orientation: portrait) {
    .top { grid-template-columns: 1fr auto; }
    .side { grid-column: 1 / -1; justify-self: stretch; width: auto; }
    .clock { text-align: right; }
    .lower { grid-template-columns: 1fr; grid-template-rows: 1.3fr 1fr; gap: 1.6vh; }
    .day { font-size: 2vh; grid-template-columns: 11em 1fr auto 1fr; }
    .wk-row { font-size: 2.2vh; }
    .line { font-size: 2.4vh; }
    .now-temp { font-size: 22vh; }
    .now-meta, .clock .date { font-size: 2.2vh; }
    .clock .time { font-size: 16vh; }
  }
</style>
</head>
<body>
  <div class="msg" id="loading">Loading forecast…</div>

<script src="lines.js"></script>
<script>
/* ---------- Settings: change these if you move the display ---------- */
const PLACE = "La Mirada";
const LAT = 33.9172, LON = -118.0120;
const TZ = "America/Los_Angeles";
const REFRESH_MIN = 5;                  // minutes between forecast checks

/* -------------------------------------------------------------------- */

const URL_API = "https://api.open-meteo.com/v1/forecast"
  + `?latitude=${LAT}&longitude=${LON}`
  + "&current=temperature_2m,apparent_temperature,weather_code,is_day"
  + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
  + `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=${encodeURIComponent(TZ)}&forecast_days=7`;

const CODES = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Freezing fog",
  51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",
  61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",
  71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Light showers",81:"Showers",82:"Heavy showers",
  85:"Snow showers",86:"Snow showers",95:"Thunderstorms",96:"Thunderstorms with hail",99:"Thunderstorms with hail"};

// Temperature to color: cold blue through mild green to hot orange-red
const STOPS = [[35,"#7A9FE8"],[50,"#86C3E0"],[62,"#9BD3A0"],[72,"#EBCB5E"],[82,"#F0964A"],[95,"#DE5A3C"]];
function hex(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));}
function tempColor(t){
  if (t<=STOPS[0][0]) return STOPS[0][1];
  for (let i=1;i<STOPS.length;i++){
    if (t<=STOPS[i][0]){
      const [t0,c0]=STOPS[i-1],[t1,c1]=STOPS[i],f=(t-t0)/(t1-t0),a=hex(c0),b=hex(c1);
      return "rgb("+a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(",")+")";
    }
  }
  return STOPS[STOPS.length-1][1];
}

/* ---------- Weather icons (drawn in a 64x64 box) ---------- */
const CLOUD = "M20 46H45A9 9 0 0 0 46 28A13 13 0 0 0 21.5 25A10.5 10.5 0 0 0 20 46Z";
function sunG(cx,cy,r){ let rays=""; for(let k=0;k<8;k++){ const a=k*Math.PI/4, x1=cx+Math.cos(a)*(r+4), y1=cy+Math.sin(a)*(r+4), x2=cx+Math.cos(a)*(r+9), y2=cy+Math.sin(a)*(r+9);
  rays+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; }
  return `<g stroke="#F2C14E" stroke-width="3.5" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="#F2C14E"/>`; }
function moonG(cx,cy,r){ return `<path d="M${cx+r*.35} ${cy-r} A${r} ${r} 0 1 0 ${cx+r} ${cy+r*.45} A${r*.8} ${r*.8} 0 0 1 ${cx+r*.35} ${cy-r}Z" fill="#D9DEE8"/>`; }
function cloudG(dy=0, fill="#C9D3E0"){ return `<path d="${CLOUD}" transform="translate(0 ${dy})" fill="${fill}"/>`; }
function iconKind(code){
  if (code<=1) return "clear"; if (code===2) return "partly"; if (code===3) return "cloudy";
  if (code===45||code===48) return "fog"; if (code>=51&&code<=57) return "drizzle";
  if ((code>=61&&code<=67)||(code>=80&&code<=82)) return "rain";
  if ((code>=71&&code<=77)||code===85||code===86) return "snow"; if (code>=95) return "storm"; return "cloudy";
}
function iconSVG(code, isDay){
  const k=iconKind(code); let g="";
  if (k==="clear") g = isDay ? sunG(32,32,11) : moonG(30,32,14);
  else if (k==="partly") g = (isDay ? sunG(24,22,8) : moonG(24,22,9)) + `<g transform="translate(6 7) scale(.88)">${cloudG()}</g>`;
  else if (k==="cloudy") g = cloudG(-3);
  else if (k==="fog") g = cloudG(-10,"#AEB8C7") + `<g stroke="#C9D3E0" stroke-width="3.5" stroke-linecap="round"><line x1="14" y1="45" x2="50" y2="45"/><line x1="18" y1="53" x2="46" y2="53"/></g>`;
  else if (k==="drizzle") g = cloudG(-8) + `<g fill="#8FB8E8"><circle cx="24" cy="48" r="2.5"/><circle cx="34" cy="51" r="2.5"/><circle cx="44" cy="48" r="2.5"/></g>`;
  else if (k==="rain") g = cloudG(-8) + `<g stroke="#8FB8E8" stroke-width="3.5" stroke-linecap="round"><line x1="25" y1="44" x2="21" y2="55"/><line x1="35" y1="44" x2="31" y2="55"/><line x1="45" y1="44" x2="41" y2="55"/></g>`;
  else if (k==="snow") g = cloudG(-8) + `<g fill="#EEF1F5"><circle cx="23" cy="49" r="3"/><circle cx="33" cy="54" r="3"/><circle cx="43" cy="49" r="3"/></g>`;
  else g = cloudG(-8,"#AEB8C7") + `<path d="M35 40L27 51H33L29 60L40 47H34L37 40Z" fill="#F2C14E"/>`;
  return `<g class="wx">${g}</g>`;
}
let data = null, lastOk = null, lastErr = false;
try { const c = JSON.parse(localStorage.getItem("wx")); if (c) { data = c.data; lastOk = new Date(c.at); } } catch(e) {}

function nowParts(){
  const p = new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date());
  const g = k => p.find(x=>x.type===k).value;
  return { date:`${g("year")}-${g("month")}-${g("day")}`, hour: Number(g("hour"))%24, minute: Number(g("minute")) };
}

async function load(){
  try {
    const r = await fetch(URL_API, {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); lastOk = new Date(); lastErr = false;
    try { localStorage.setItem("wx", JSON.stringify({data, at:lastOk.toISOString()})); } catch(e) {}
  } catch(e) { lastErr = true; }
  render();
}

function weekday(dateStr){ const [y,m,d]=dateStr.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("en-US",{weekday:"short",timeZone:"UTC"}); }

// Today and tomorrow, big: low to high
function daysHTML(np, curTemp){
  const d=data.daily; let i0=d.time.indexOf(np.date); if (i0<0) i0=0;
  const idx=[i0,i0+1].filter(i=>i<d.time.length);
  const full=ds=>{ const [y,m,dd]=ds.split("-").map(Number); return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString("en-US",{weekday:"long",timeZone:"UTC"}); };
  return `<section class="days">${idx.map((i,k)=>{
    const tLo=d.temperature_2m_min[i], tHi=d.temperature_2m_max[i], p=d.precipitation_probability_max[i] ?? 0;
    return `<div class="day">
      <div class="day-name"><b>${k===0?"Today":"Tomorrow"}</b><span>${full(d.time[i])}</span>
        <svg class="day-icon" viewBox="0 0 64 64" aria-hidden="true">${iconSVG(d.weather_code?d.weather_code[i]:3,1)}</svg>
        ${p>=20?`<em>${p}% chance of rain</em>`:""}</div>
      <div class="day-temp"><span>Low</span><b style="color:${tempColor(tLo)}">${Math.round(tLo)}°</b></div>
      <svg class="day-arrow" viewBox="0 0 120 40" aria-hidden="true"><defs><linearGradient id="ag${k}" x1="0" x2="1"><stop offset="0" stop-color="${tempColor(tLo)}"/><stop offset="1" stop-color="${tempColor(tHi)}"/></linearGradient></defs><path d="M6 20H104M88 6L106 20L88 34" fill="none" stroke="url(#ag${k})" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="day-temp"><span>High</span><b style="color:${tempColor(tHi)}">${Math.round(tHi)}°</b></div>
    </div>`; }).join("")}</section>`;
}

// 7-day list, styled like a phone weather app: day, icon, rain chance, low, range bar, high
function lastAge(){ return lastOk ? Math.round((Date.now()-lastOk)/60000) : 0; }
function weekHTML(np, curTemp){
  const d=data.daily, n=Math.min(7,d.time.length);
  const lows=d.temperature_2m_min.slice(0,n), highs=d.temperature_2m_max.slice(0,n);
  const wMin=Math.min(...lows), wMax=Math.max(...highs), span=Math.max(1,wMax-wMin);
  let rows="";
  for (let i=0;i<n;i++){
    const lo=lows[i], hi=highs[i], p=d.precipitation_probability_max[i] ?? 0;
    const left=(lo-wMin)/span*100, width=Math.max(2,(hi-lo)/span*100);
    const grad=`linear-gradient(90deg, ${tempColor(lo)}, ${tempColor((lo+hi)/2)}, ${tempColor(hi)})`;
    const dot = i===0 && d.time[0]===np.date ? `<i class="dot" style="left:${Math.min(100,Math.max(0,(curTemp-wMin)/span*100))}%"></i>` : "";
    rows+=`<div class="wk-row">
      <span class="wk-day">${i===0 && d.time[0]===np.date ? "Today" : weekday(d.time[i])}</span>
      <span class="wk-icon"><svg viewBox="0 0 64 64" aria-hidden="true">${iconSVG(d.weather_code ? d.weather_code[i] : 3, 1)}</svg>${p>=20?`<em>${p}%</em>`:""}</span>
      <span class="wk-lo">${Math.round(lo)}°</span>
      <span class="wk-bar"><span class="wk-fill" style="left:${left}%;width:${width}%;background:${grad}"></span>${dot}</span>
      <span class="wk-hi">${Math.round(hi)}°</span>
    </div>`;
  }
  return `<section class="week"><div class="chart-title"><b>7-day</b> forecast</div><div class="wk-rows">${rows}</div><div class="status ${lastErr?"warn":""}">${PLACE}, ${lastErr ? `couldn't refresh; data from ${lastAge()} min ago` : `updated ${lastAge()===0?"just now":lastAge()+" min ago"}`}</div></section>`;
}

// Shuffle a list the same way every time (fixed seed), so the order is mixed but stable.
function stableShuffle(list, seed){
  const out=list.slice(); let t=seed>>>0;
  const rnd=()=>{ t+=0x6D2B79F5; let r=Math.imul(t^(t>>>15),1|t); r^=r+Math.imul(r^(r>>>7),61|r); return ((r^(r>>>14))>>>0)/4294967296; };
  for (let i=out.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}
let LINES=null;
function lines(){
  if (LINES) return LINES;
  const Q=window.DAILY_QUOTES||[], G=stableShuffle(window.DAILY_JOKES||[],2), K=stableShuffle(window.DAILY_JOKES_KOREAN||[],3);
  const jokes=[]; for (let i=0;i<Math.max(G.length,K.length);i++){ if (G[i]) jokes.push(G[i]); if (K[i]) jokes.push(K[i]); }
  LINES={quotes:stableShuffle(Q,1), jokes};
  return LINES;
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function dailyLine(dateStr){
  const {quotes, jokes}=lines();
  const [y,m,d]=dateStr.split("-").map(Number);
  const day=Math.floor(Date.UTC(y,m-1,d)/86400000), slot=Math.floor(day/2);
  if (day%2===0 && quotes.length){ const [q,src]=quotes[slot%quotes.length];
    return `<p class="line-kind">Inspiration of the Day</p><p class="line quote">\u201C${esc(q)}\u201D <span class="line-src">${esc(src)}</span></p>`; }
  if (jokes.length) return `<p class="line-kind">Joke of the Day</p><p class="line">${esc(jokes[slot%jokes.length])}</p>`;
  return "";
}

function render(){
  const np = nowParts();
  if (!data){ document.body.innerHTML=`<div class="msg">Can't reach the forecast service. Check the tablet's Wi-Fi; it will retry every ${REFRESH_MIN} minutes.</div>`; return; }

  const c=data.current;
  const tp = new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"}).formatToParts(new Date());
  const tv = k => (tp.find(x=>x.type===k)||{}).value || "";
  const timeHTML = `${tv("hour")}:${tv("minute")}<sup>${tv("dayPeriod")}</sup>`;
  const wd = new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"long"}).format(new Date());
  const md = new Intl.DateTimeFormat("en-US",{timeZone:TZ,month:"long",day:"numeric"}).format(new Date());

  document.body.innerHTML = `
    <section class="top">
      <div>
        <div class="now-row"><div class="now-temp" style="color:${tempColor(c.temperature_2m)}">${Math.round(c.temperature_2m)}<sup>°F</sup></div><svg class="now-icon" viewBox="0 0 64 64" aria-hidden="true">${iconSVG(c.weather_code, c.is_day)}</svg></div>
        <div class="now-meta"><b>${CODES[c.weather_code]||"—"}</b>, feels like ${Math.round(c.apparent_temperature)}°</div>
      </div>
      <div class="clock"><div class="time">${timeHTML}</div><div class="date"><b>${wd}</b>, ${md}</div></div>
      <div class="side">${dailyLine(np.date)}</div>
    </section>
    <section class="lower">
      ${daysHTML(np, c.temperature_2m)}
      ${weekHTML(np, c.temperature_2m)}
    </section>`;
  centerIcons();
}

function centerIcons(){
  document.querySelectorAll("g.wx").forEach(g=>{
    try { const b=g.getBBox(); g.setAttribute("transform",`translate(${(32-(b.x+b.width/2)).toFixed(2)} ${(32-(b.y+b.height/2)).toFixed(2)})`); } catch(e) {}
  });
}

async function keepAwake(){ try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch(e) {} }
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden){ keepAwake(); load(); } });

window.addEventListener("resize", ()=>{ if (data) render(); });
keepAwake();
if (data) render();
load();
setInterval(load, REFRESH_MIN*60000);
let lastMinute="";
setInterval(()=>{ const m=new Date().getMinutes(); if (data && m!==lastMinute){ lastMinute=m; render(); } }, 1000);
</script>
</body>
</html>
